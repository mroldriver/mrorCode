# mrorcode 配置样例
# 复制到 ~/.mrorcode/config.toml 并填入你的端点。
# 也可以不建文件，直接用环境变量：
#   MRORCODE_BASE_URL / MRORCODE_API_KEY / MRORCODE_MODEL

# 默认模型（可被 --model 覆盖）
default_model = "deepseek-chat"

[providers.default]
type = "openai_compat"
base_url = "https://api.deepseek.com/v1"
api_key = "sk-your-key"
model = "deepseek-chat"
context_window = 128000

# 本地 OpenAI 兼容端点示例（Ollama / vLLM 等，api_key 可留空）：
# [providers.local]
# type = "openai_compat"
# base_url = "http://127.0.0.1:11434/v1"
# api_key = ""
# model = "qwen2.5-coder:7b"
# context_window = 32768
#
# 使用非默认条目：mrorcode --provider local run "hello"

# 上下文压缩（可选，全部有默认值）：
# [compaction]
# keep_recent = 6            # 保留最近 N 个 user turn 原文
# threshold_tokens = 100000  # 估算 token 超过则压缩；0 = 关闭

# MCP stdio server（可选，可声明多个）：
# [[mcp.servers]]
# name = "filesystem"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "."]
# env = { FOO = "bar" }
#
# 启动时拉起子进程并把其工具注册为 mcp__<server>__<tool>；
# 断连 fail-closed。未声明即不启用。

# Anthropic provider（可选）：
# [providers.claude]
# type = "anthropic"
# base_url = "https://api.anthropic.com"
# api_key = "sk-ant-xxx"
# model = "claude-sonnet-4-5"
# context_window = 200000
#
# 使用：mrorcode --provider claude run "hello"
