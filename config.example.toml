# mrorcode 配置样例
# 复制到 ~/.mrorcode/config.toml 并填入你的端点。
# 也可以不建文件，直接用环境变量：
#   MRORCODE_BASE_URL / MRORCODE_API_KEY / MRORCODE_MODEL

# 默认模型（可被 --model 覆盖）
default_model = "deepseek-chat"

[providers.default]
type = "openai_compat"
base_url = "https://api.deepseek.com/v1"
api_key = "sk-your-key"
model = "deepseek-chat"
context_window = 128000

# 本地 OpenAI 兼容端点示例（Ollama / vLLM 等，api_key 可留空）：
# [providers.local]
# type = "openai_compat"
# base_url = "http://127.0.0.1:11434/v1"
# api_key = ""
# model = "qwen2.5-coder:7b"
# context_window = 32768
#
# 使用非默认条目：mrorcode --provider local run "hello"
