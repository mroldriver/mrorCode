name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  max: 1
  exceed-action: QUEUE

env:
  # 仓库根 rust-toolchain.toml 钉死了 windows-gnu host（本机无 MSVC link.exe），
  # 在 Linux runner 上用 RUSTUP_TOOLCHAIN 覆盖为当前平台的 stable host。
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (x64, stable)
    runs-on: [ubuntu-latest, x64, medium]
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: 检出代码
        uses: checkout

      - name: 安装 Rust stable
        run: rustup toolchain install stable --profile default

      - name: 代码格式
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 测试
        run: cargo test --workspace

      - name: 发布构建
        run: cargo build --release --workspace

  linux-arm64:
    name: Linux (arm64, stable)
    runs-on: [ubuntu-latest, arm64, medium]
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: 检出代码
        uses: checkout

      - name: 安装 Rust stable
        run: rustup toolchain install stable --profile default

      - name: 测试
        run: cargo test --workspace

  msrv:
    name: MSRV 1.88 (x64)
    runs-on: [ubuntu-latest, x64, small]
    env:
      RUSTUP_TOOLCHAIN: "1.88.0"
    steps:
      - name: 检出代码
        uses: checkout

      - name: 安装 Rust 1.88
        run: rustup toolchain install 1.88.0 --profile default

      - name: 测试
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
