name: mirror-from-gitcode

# GitCode 是代码真源，GitHub 是镜像 + 构建/发版平台。
# 本工作流定时把 GitCode 的分支与标签强制同步到 GitHub，不涉及 GitCode Release。
#
# CI 为什么不放 GitCode：GitCode 的流水线（.gitcode/workflows）不对个人用户开放，
# 且没有 Windows/macOS 托管 runner；跨平台构建只有 GitHub Actions 能做到（见 release.yml）。
#
# 四条硬规则（也是安全护栏，不要删）：
#   1) 不要在 GitHub 上直接提交/合并：下一次镜像会把它覆盖掉。
#   2) GitCode 的默认分支里必须已经有 .github/workflows/ 下的全部工作流：
#      强制同步是整棵树覆盖，GitCode 没有这些文件就会把 GitHub 上的工作流删掉（含本文件），
#      所以下面的“安全检查”发现缺失就直接失败，不做同步。
#   3) GitHub 仓库的默认分支名要和 GitCode 一致，否则“安全检查”第一步就失败。
#   4) 仓库改名或改大小写时同步更新 GITCODE_REPO（当前为 mroldriver/mrorCode）。
#
# 首次启用顺序：本地提交本文件 -> 推 GitCode（origin）-> 推 GitHub -> 再到 Actions 手动跑一次确认。

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '允许覆盖 GitHub 上多出来的提交（危险，会丢提交）'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write        # gh workflow run 需要

concurrency:
  group: mirror-from-gitcode
  cancel-in-progress: false

env:
  GITCODE_REPO: mroldriver/mrorCode
  # 缺任意一个就不允许同步：整棵树覆盖会把 GitHub 侧的工作流删掉
  REQUIRED_FILES: .github/workflows/release.yml .github/workflows/mirror-from-gitcode.yml

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 拉取 GitCode
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          set -euo pipefail
          # GitCode 公开仓库匿名 HTTPS 即可读（本地已验证），GITCODE_TOKEN 只在需要私有读时配置。
          if [ -n "${GITCODE_TOKEN:-}" ]; then
            url="https://oauth2:${GITCODE_TOKEN}@gitcode.com/${GITCODE_REPO}.git"
          else
            url="https://gitcode.com/${GITCODE_REPO}.git"
          fi
          git remote add gitcode "$url" 2>/dev/null || git remote set-url gitcode "$url"
          git fetch --tags --force --prune gitcode '+refs/heads/*:refs/remotes/gitcode/*'
          echo "--- GitCode 侧引用："
          git for-each-ref --format='%(refname:short) %(objectname:short)' refs/remotes/gitcode
          echo "--- GitCode 标签："
          git tag --list 'v*' --sort=-creatordate | head -5

      - name: 安全检查
        env:
          FORCE: ${{ github.event.inputs.force }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          src="refs/remotes/gitcode/${DEFAULT_BRANCH}"

          if ! git rev-parse --verify --quiet "$src" >/dev/null; then
            echo "::error::GitCode 上找不到分支 ${DEFAULT_BRANCH}；检查 GitHub 仓库的默认分支名是否与 GitCode 一致"
            exit 1
          fi

          for f in ${REQUIRED_FILES}; do
            if ! git cat-file -e "${src}:$f" 2>/dev/null; then
              echo "::error::GitCode 的 ${DEFAULT_BRANCH} 缺少 $f；强制同步会把 GitHub 上的工作流删掉。请先把 .github/workflows 提交推送到 GitCode。"
              exit 1
            fi
          done

          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

          failed=0
          for ref in $(git for-each-ref --format='%(refname:short)' refs/remotes/gitcode); do
            b="${ref#gitcode/}"
            [ "$b" = "HEAD" ] && continue
            echo "--- 检查分支 $b"
            if git rev-parse --verify --quiet "refs/remotes/origin/$b" >/dev/null; then
              if ! git merge-base --is-ancestor "refs/remotes/origin/$b" "refs/remotes/gitcode/$b"; then
                if [ "${FORCE:-false}" = "true" ]; then
                  echo "::warning::GitHub 的 $b 存在 GitCode 没有的提交，按 force=true 强制覆盖"
                else
                  echo "::error::GitHub 的 $b 存在 GitCode 没有的提交（很可能是有人在 GitHub 直接提交）。强制同步会丢掉它们；确认要丢弃请手动触发并勾选 force。"
                  failed=1
                fi
              fi
            else
              echo "GitHub 上尚无 $b，将新建"
            fi
          done
          exit $failed

      - name: 强制同步到 GitHub
        run: |
          set -euo pipefail
          for ref in $(git for-each-ref --format='%(refname:short)' refs/remotes/gitcode); do
            b="${ref#gitcode/}"
            [ "$b" = "HEAD" ] && continue

            # 别把 GitHub 侧的工作流删掉：GitHub 侧文件齐全而 GitCode 侧缺任意一个时跳过
            gh_ok=yes gc_ok=yes
            for f in ${REQUIRED_FILES}; do
              git cat-file -e "refs/remotes/origin/$b:$f" 2>/dev/null || gh_ok=no
              git cat-file -e "refs/remotes/gitcode/$b:$f" 2>/dev/null || gc_ok=no
            done
            if [ "$gh_ok" = yes ] && [ "$gc_ok" = no ]; then
              echo "::warning::跳过分支 $b：GitHub 侧工作流齐全而 GitCode 侧有缺失，同步会删掉工作流"
              continue
            fi

            echo "==> 分支 $b"
            # 只更新 GitCode 上存在的分支，绝不删除 GitHub 独有的分支
            git push --force origin "refs/remotes/gitcode/${b}:refs/heads/${b}"
          done

          if [ -n "$(git tag --list 'v*' | head -1)" ]; then
            echo "==> 标签"
            # 标签只新增/更新，不删除 GitHub 上已有的
            git push --force origin 'refs/tags/*:refs/tags/*'
          else
            echo "GitCode 上没有 v* 标签，跳过"
          fi

      - name: 为新标签触发 Release 构建
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # GITHUB_TOKEN 推送产生的 push 事件不会触发其它工作流，
          # 所以这里对“还没有 Release 的 v* 标签”显式 dispatch 一次 release.yml。
          for t in $(git tag --list 'v*' --sort=-creatordate | head -3); do
            if gh release view "$t" >/dev/null 2>&1; then
              echo "$t 已有 Release，跳过"
            else
              echo "$t 没有 Release，触发构建"
              gh workflow run release.yml -f "tag=$t"
            fi
          done
