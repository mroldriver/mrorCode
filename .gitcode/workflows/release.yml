name: Release

# tag（v*）推送或手动触发：构建 Linux/Windows 单二进制产物并上传。
on:
  push:
    tags:
      - v*
  workflow_dispatch:

concurrency:
  max: 1
  exceed-action: QUEUE

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-x64:
    name: 产物 Linux x64
    runs-on: [ubuntu-latest, x64, medium]
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: 检出代码
        uses: checkout

      - name: 安装 Rust stable
        run: rustup toolchain install stable --profile default

      - name: 发布构建
        run: cargo build --release --workspace

      - name: 打包 tar.gz
        run: |
          VER=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          mkdir -p pkg && cp target/release/mrorcode pkg/
          tar -czf "mrorcode-${VER}-linux-x64.tar.gz" -C pkg mrorcode
          ls -lh "mrorcode-${VER}-linux-x64.tar.gz"

      - name: 上传构件
        uses: upload-artifact
        with:
          name: mrorcode-linux-x64
          path: mrorcode-*-linux-x64.tar.gz
          retention-days: 30

  linux-arm64:
    name: 产物 Linux arm64
    runs-on: [ubuntu-latest, arm64, medium]
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: 检出代码
        uses: checkout

      - name: 安装 Rust stable
        run: rustup toolchain install stable --profile default

      - name: 发布构建
        run: cargo build --release --workspace

      - name: 打包 tar.gz
        run: |
          VER=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          mkdir -p pkg && cp target/release/mrorcode pkg/
          tar -czf "mrorcode-${VER}-linux-arm64.tar.gz" -C pkg mrorcode
          ls -lh "mrorcode-${VER}-linux-arm64.tar.gz"

      - name: 上传构件
        uses: upload-artifact
        with:
          name: mrorcode-linux-arm64
          path: mrorcode-*-linux-arm64.tar.gz
          retention-days: 30

  windows-x64:
    name: 产物 Windows x64（gnu 交叉编译）
    runs-on: [ubuntu-latest, x64, large]
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: 检出代码
        uses: checkout

      - name: 安装 Rust stable 与 windows-gnu target
        run: |
          rustup toolchain install stable --profile default
          rustup target add x86_64-pc-windows-gnu

      - name: 安装 mingw-w64 交叉工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: 交叉编译
        run: cargo build --release --workspace --target x86_64-pc-windows-gnu

      - name: 打包 zip
        run: |
          VER=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          cp target/x86_64-pc-windows-gnu/release/mrorcode.exe .
          zip "mrorcode-${VER}-windows-x64.zip" mrorcode.exe
          ls -lh "mrorcode-${VER}-windows-x64.zip"

      - name: 上传构件
        uses: upload-artifact
        with:
          name: mrorcode-windows-x64
          path: mrorcode-*-windows-x64.zip
          retention-days: 30
