[package]
name = "mrorcode-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "mrorcode"
path = "src/main.rs"

[lib]
name = "mrorcode_cli"
path = "src/lib.rs"

[dependencies]
mrorcode-kernel = { workspace = true }
mrorcode-capabilities = { workspace = true }
mrorcode-agent = { workspace = true }
mrorcode-config = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rustyline = { workspace = true }
dirs = { workspace = true }
regex = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
mrorcode-kernel = { workspace = true, features = ["test-support"] }
mrorcode-agent = { workspace = true }
